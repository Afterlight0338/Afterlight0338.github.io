<!DOCTYPE html>
<html lang="en" data-tab="about">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404, vivlos.dev</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080b12">
  <link rel="icon" type="image/webp" href="/assets/vivlos/casual.webp">
  <!-- GitHub Pages serves this for any missing path, so every URL is absolute.
       Uses the main stylesheet's tokens and fonts: bump ?v= together with index.html -->
  <link rel="stylesheet" href="/style.css?v=6">
  <style>
    .lost {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 32px;
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    .lost-code {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent);
    }
    .lost h1 {
      font-size: clamp(3rem, 10vw, 5.5rem);
      font-weight: 900;
      line-height: 1;
      color: var(--text-bright);
    }
    .lost p {
      margin-top: 12px;
      font-size: 1.1rem;
      color: var(--text-secondary);
    }
    .lost a {
      display: inline-block;
      margin-top: 20px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
    }
    .lost img { height: 360px; width: auto; }
    @media (max-width: 640px) {
      .lost { grid-template-columns: 1fr; align-content: center; }
      .lost img { height: 240px; justify-self: end; }
    }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <span class="lost-code">404 · not found</span>
      <h1>Nothing here.</h1>
      <p>This page doesn't exist, or I broke it.</p>
      <a href="/">← Back to vivlos.dev</a>
    </div>
    <img src="/assets/vivlos/casual.webp" alt="Vivlos, looking for the page too">
  </main>
</body>
</html>
